name: Nightly

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  nightly-quality:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[dev]
          pip install "ruff>=0.8,<1" "bandit>=1.7.10,<2" "pip-audit>=2.7,<3"

      - name: Ruff
        run: ruff check tap_qualtrics tests

      - name: Bandit
        run: bandit -q -r tap_qualtrics -ll

      - name: pip-audit
        run: pip-audit

      - name: Unit tests
        run: coverage run --branch -m pytest tests/unittests -q

      - name: Non-functional export tests
        run: python -m pytest tests/unittests/test_nonfunctional_exports.py -q

      - name: Contract replay tests (offline)
        env:
          ENFORCE_CONTRACT_FIXTURE_COVERAGE: "1"
        run: python -m pytest tests/contracts/test_stream_contract_replay.py -q

      - name: Live schema contract (optional when config secret exists)
        env:
          QUALTRICS_CONTRACT_CONFIG_JSON: ${{ secrets.QUALTRICS_CONTRACT_CONFIG_JSON }}
        shell: bash
        run: |
          if [ -z "${QUALTRICS_CONTRACT_CONFIG_JSON:-}" ]; then
            echo "QUALTRICS_CONTRACT_CONFIG_JSON is not set; skipping live schema contract."
            exit 0
          fi
          printf '%s' "$QUALTRICS_CONTRACT_CONFIG_JSON" > /tmp/qualtrics_contract_config.json
          QUALTRICS_CONTRACT_CONFIG=/tmp/qualtrics_contract_config.json \
            python -m pytest tests/contracts/test_live_schema_contract.py -q -m live_contract

      - name: Generate per-stream test matrix
        run: python scripts/generate_stream_test_matrix.py

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: |
            test_output/stream_test_matrix.md
            test_output/stream_test_matrix.csv

      - name: Notify on failure (Slack webhook)
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          payload='{"text":":rotating_light: tap-qualtrics nightly workflow failed on master. Check GitHub Actions run for details."}'
          curl -sS -X POST -H "Content-type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL"
